name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/scripts/Test-MarkdownLinks.ps1"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/scripts/Test-MarkdownLinks.ps1"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  local-links:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate local Markdown links
        shell: pwsh
        run: ./.github/scripts/Test-MarkdownLinks.ps1
